                import {
                    initializeApp
                } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

                import {
                    getAuth,
                    createUserWithEmailAndPassword,
                    signInWithEmailAndPassword,
                    signOut,
                    onAuthStateChanged,
                    setPersistence,
                    browserLocalPersistence
                } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

                import {
                    getFirestore,
                    collection,
                    getDocs,
                    getDoc,
                    doc,
                    setDoc,
                    addDoc,
                    updateDoc,
                    deleteDoc,
                    Timestamp,
                    query,
                    orderBy
                } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


                /*
                 * Firebase configuration
                 */
                const firebaseConfig = {

                    apiKey: "AIzaSyBpsFphitX3tnTVqWnkusMgU6G2kZNd-vI",

                    authDomain:
                        "interview-prep-6caf8.firebaseapp.com",

                    projectId:
                        "interview-prep-6caf8",

                    storageBucket:
                        "interview-prep-6caf8.firebasestorage.app",

                    messagingSenderId:
                        "7763277998",

                    appId:
                        "1:7763277998:web:49d02d97d55c5a8f48d53f",

                    measurementId:
                        "G-F52N8W4DF7"
                };


                let firebaseApp;
                let auth;
                let db;


                /*
                 * Initialize Firebase
                 */
                try {

                    firebaseApp =
                        initializeApp(firebaseConfig);


                    auth =
                        getAuth(firebaseApp);


                    db =
                        getFirestore(firebaseApp);


                    /*
                     * Keep the user authenticated between
                     * page navigation and application restarts.
                     */
                    await setPersistence(
                        auth,
                        browserLocalPersistence
                    );


                    console.log(
                        "Firebase initialized successfully"
                    );


                    /*
                     * Wait until Firebase has determined
                     * the current authentication state.
                     */
                    function waitForAuthState() {

                        return new Promise((resolve) => {

                            const unsubscribe =
                                onAuthStateChanged(
                                    auth,
                                    (user) => {

                                        unsubscribe();

                                        resolve(user);

                                    }
                                );

                        });

                    }


                    /*
                     * Get the Firestore profile for
                     * the currently authenticated user.
                     */
                    async function getUserProfile(user) {

                        if (!user) {
                            return null;
                        }


                        const userDocument =
                            await getDoc(
                                doc(
                                    db,
                                    "users",
                                    user.uid
                                )
                            );


                        if (!userDocument.exists()) {

                            console.warn(
                                "Firestore profile does not exist for:",
                                user.uid
                            );

                            return {

                                uid: user.uid,

                                firstName: "",

                                lastName: "",

                                emailAddress:
                                    user.email ?? "",

                                userType: "User"

                            };
                        }


                        const data =
                            userDocument.data();


                        return {

                            uid: user.uid,

                            firstName:
                                data.firstName ?? "",

                            lastName:
                                data.lastName ?? "",

                            emailAddress:
                                data.emailAddress ??
                                user.email ??
                                "",

                            userType:
                                data.userType ??
                                "User"
                        };
                    }


                    /*
                     * Firebase bridge used by Blazor.
                     */
                    window.firebaseAuth = {


                        /*
                         * REGISTER
                         */
                        register: async function (
                            email,
                            password,
                            firstName,
                            lastName
                        ) {

                            try {

                                const result =
                                    await createUserWithEmailAndPassword(
                                        auth,
                                        email,
                                        password
                                    );


                                const user =
                                    result.user;


                                /*
                                 * Create the user's Firestore profile.
                                 */
                                await setDoc(

                                    doc(
                                        db,
                                        "users",
                                        user.uid
                                    ),

                                    {

                                        firebaseUid:
                                            user.uid,

                                        firstName:
                                            firstName,

                                        lastName:
                                            lastName,

                                        emailAddress:
                                            email,

                                        userType:
                                            "User"
                                    }
                                );


                                console.log(
                                    "User profile created:",
                                    user.uid
                                );


                                return {

                                    success: true,

                                    uid:
                                        user.uid,

                                    firstName:
                                        firstName,

                                    lastName:
                                        lastName,

                                    emailAddress:
                                        email,

                                    userType:
                                        "User"
                                };

                            }
                            catch (error) {

                                console.error(
                                    "Firebase registration error:",
                                    error
                                );


                                return {

                                    success: false,

                                    message:
                                        error.message
                                };
                            }
                        },


                        /*
                         * LOGIN
                         */
                        login: async function (
                            email,
                            password
                        ) {

                            try {

                                const result =
                                    await signInWithEmailAndPassword(
                                        auth,
                                        email,
                                        password
                                    );


                                const user =
                                    result.user;


                                console.log(
                                    "Firebase login successful:",
                                    user.uid
                                );


                                /*
                                 * Firebase has authenticated the user.
                                 * Now retrieve their Firestore profile.
                                 */
                                const profile =
                                    await getUserProfile(user);


                                if (!profile) {

                                    return {

                                        success: false,

                                        message:
                                            "Unable to load user profile."
                                    };
                                }


                                return {

                                    success: true,

                                    uid:
                                        profile.uid,

                                    firstName:
                                        profile.firstName,

                                    lastName:
                                        profile.lastName,

                                    emailAddress:
                                        profile.emailAddress,

                                    userType:
                                        profile.userType
                                };

                            }
                            catch (error) {

                                console.error("Firebase login error:",error);

                                return {

                                    success: false,

                                    message: error.message
                                };
                            }
                        },


                        /*
                         * GET CURRENT USER
                         */
                        getCurrentUser: async function () {

                            console.log(
                                "Checking Firebase authentication state..."
                            );


                            /*
                             * IMPORTANT:
                             *
                             * Do not directly use:
                             *
                             * auth.currentUser
                             *
                             * because Firebase may still be
                             * restoring the authentication state.
                             */
                            const user =
                                await waitForAuthState();


                            if (!user) {

                                console.log(
                                    "No authenticated Firebase user."
                                );

                                return null;
                            }


                            console.log(
                                "Authenticated Firebase user:",
                                user.email
                            );


                            return await getUserProfile(user);
                        },


                        /*
                         * LOGOUT
                         */
                        logout: async function () {

                            try {

                                await signOut(auth);


                                console.log(
                                    "Firebase user signed out"
                                );


                                return {

                                    success: true

                                };

                            }
                            catch (error) {

                                console.error(
                                    "Firebase logout error:",
                                    error
                                );


                                return {

                                    success: false,

                                    message:
                                        error.message
                                };
                            }
                        }

                    };


                    /*
                     * Firebase is ready.
                     */
                    window.isFirebaseReady =
                        function () {

                            return true;

                        };


                    console.log(
                        "Firebase authentication bridge ready"
                    );

                }
                catch (error) {

                    console.error(
                        "Firebase initialization failed:",
                        error
                    );


                    window.isFirebaseReady =
                        function () {

                            return false;

                        };

};

window.firebaseAuth.getUsers = async function () {

    const currentUser = auth.currentUser;

    if (!currentUser) {
        throw new Error("You must be logged in.");
    }

    const snapshot = await getDocs(
        collection(db, "users")
    );

    const users = [];

    snapshot.forEach((documentSnapshot) => {

        const data = documentSnapshot.data();

        users.push({
            userId: documentSnapshot.id,
            firebaseUid: data.firebaseUid || documentSnapshot.id,
            firstName: data.firstName || "",
            lastName: data.lastName || "",
            emailAddress: data.emailAddress || "",
            userType: data.userType || "User"
        });

    });

    return users;
};


window.firebaseAuth.updateUserRole = async function (
    userId,
    userType
) {

    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    if (
        userType !== "User" &&
        userType !== "Admin"
    ) {
        throw new Error("Invalid user type.");
    }

    await updateDoc(
        doc(db, "users", userId),
        {
            userType: userType
        }
    );

    return true;
};


window.firebaseAuth.deleteUserProfile = async function (
    userId
) {

    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    await deleteDoc(
        doc(db, "users", userId)
    );

    return true;
};

// Get all donations
window.firebaseAuth.getDonations = async function () {

    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    const snapshot = await getDocs(
        collection(db, "donations")
    );

    const donations = [];

    snapshot.forEach((documentSnapshot) => {

        const data = documentSnapshot.data();

        let dateValue = null;

        /*
         * Firestore Timestamp
         */
        if (
            data.date &&
            typeof data.date.toDate === "function"
        ) {
            dateValue = data.date.toDate().toISOString();
        }

        /*
         * JavaScript Date
         */
        else if (data.date instanceof Date) {
            dateValue = data.date.toISOString();
        }

        /*
         * Existing ISO/string date
         */
        else if (
            typeof data.date === "string" &&
            data.date.trim() !== ""
        ) {
            dateValue = data.date;
        }

        /*
         * Fallback
         */
        else {
            dateValue = new Date().toISOString();
        }

        donations.push({
            donationId: documentSnapshot.id,
            userId: data.userId || "",
            amount: Number(data.amount || 0),
            date: dateValue,
            donorName: data.donorName || "",
            givingType: data.givingType || "General",
            paymentMethod: data.paymentMethod || "Cash"
        });
    });

    return donations;
};


// Create a donation record
window.firebaseAuth.createDonation = async function (donation) {

    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    if (!donation) {
        throw new Error("Donation data is required.");
    }

    const amount = Number(donation.amount);

    if (!Number.isFinite(amount) || amount <= 0) {
        throw new Error("Donation amount must be greater than zero.");
    }

    let donationDate;

    if (donation.date) {
        donationDate = Timestamp.fromDate(
            new Date(donation.date)
        );
    }
    else {
        donationDate = Timestamp.now();
    }

    const donationData = {
        userId: donation.userId || auth.currentUser.uid,

        amount: amount,

        date: donationDate,

        donorName: donation.donorName || "",

        givingType: donation.givingType || "General",

        paymentMethod: donation.paymentMethod || "Cash"
    };

    const documentReference = await addDoc(
        collection(db, "donations"),
        donationData
    );

    return {
        success: true,
        donationId: documentReference.id
    };
};

            donorName: donorName || "",

    return true;
};

window.firebaseAuth.getMessages = async function () {

    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    const snapshot =
        await getDocs(
            collection(db, "messages")
        );

    const messages = [];

    snapshot.forEach((documentSnapshot) => {

        const data =
            documentSnapshot.data();

        let messageId =
            parseInt(documentSnapshot.id);

        if (isNaN(messageId)) {
            messageId = 0;
        }


        let messageDate = null;

        if (data.date) {

            if (typeof data.date.toDate === "function") {

                messageDate =
                    data.date.toDate().toISOString();

            } else {

                messageDate =
                    data.date;
            }
        }


        messages.push({

            messageId: messageId,

            userId:
                Number(data.userId || 0),

            title:
                data.title || "",

            content:
                data.content || "",

            date:
                messageDate,

            userName:
                data.userName || "",

            isRead:
                data.isRead === true

        });

    });


    return messages;
};

window.firebaseAuth.getSermons = async function () {

    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    const sermonsRef = collection(db, "sermons");

    const sermonsQuery = query(
        sermonsRef,
        orderBy("date", "desc")
    );

    const snapshot = await getDocs(sermonsQuery);

    const sermons = [];

    snapshot.forEach((documentSnapshot) => {

        const data = documentSnapshot.data();

        sermons.push({
            sermonId: documentSnapshot.id,

            title: data.title || "",

            content: data.content || "",

            date: data.date
                ? data.date.toDate().toISOString()
                : new Date().toISOString(),

            pastorName: data.pastorName || "",

            imageUrl: data.imageUrl || "",

            duration: data.duration || ""
        });
    });

    return sermons;
};


window.firebaseAuth.createSermon = async function (sermon) {

    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    if (!sermon) {
        throw new Error("Sermon data is required.");
    }

    if (!sermon.title || sermon.title.trim() === "") {
        throw new Error("Sermon title is required.");
    }

    /*
     * Blazor serializes DateTime to an ISO date string.
     * Convert it into a JavaScript Date first.
     */
    const sermonDate = sermon.date
        ? new Date(sermon.date)
        : new Date();

    if (isNaN(sermonDate.getTime())) {
        throw new Error("Invalid sermon date.");
    }

    /*
     * Convert JavaScript Date to Firestore Timestamp.
     */
    const firestoreTimestamp =
        Timestamp.fromDate(sermonDate);

    const sermonData = {

        title: sermon.title.trim(),

        content: sermon.content || "",

        date: firestoreTimestamp,

        pastorName: sermon.pastorName || "",

        imageUrl: sermon.imageUrl || "",

        duration: sermon.duration || "",

        createdBy: auth.currentUser.uid,

        createdAt: Timestamp.now()
    };

    const documentReference = await addDoc(
        collection(db, "sermons"),
        sermonData
    );

    return {
        sermonId: documentReference.id,

        title: sermonData.title,

        content: sermonData.content,

        date: sermonDate.toISOString(),

        pastorName: sermonData.pastorName,

        imageUrl: sermonData.imageUrl,

        duration: sermonData.duration
    };
};

window.firebaseAuth.getSermons = async function () {

    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    const snapshot =
        await getDocs(
            collection(db, "sermons")
        );

    const sermons = [];

    snapshot.forEach((documentSnapshot) => {

        const data =
            documentSnapshot.data();

        let sermonDate = "";

        if (data.date) {

            if (typeof data.date.toDate === "function") {

                sermonDate =
                    data.date.toDate().toISOString();

            } else {

                sermonDate =
                    data.date;
            }
        }


        sermons.push({

            sermonId:
                Number(
                    data.sermonId ||
                    documentSnapshot.id ||
                    0
                ),

            title:
                data.title || "",

            content:
                data.content || "",

            date:
                sermonDate,

            pastorName:
                data.pastorName || "",

            imageUrl:
                data.imageUrl || "",

            videoUrl:
                data.videoUrl || "",

            duration:
                data.duration || ""
        });
    });


    return sermons;
};

/*
 * USER:
 * Create a prayer request.
 *
 * The Firebase UID is taken directly from the
 * authenticated Firebase user rather than being
 * supplied by the Razor page.
 */
window.firebaseAuth.createPrayerRequest = async function (
    title,
    content
) {

    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    if (!title || title.trim() === "") {
        throw new Error("Prayer request title is required.");
    }

    if (!content || content.trim() === "") {
        throw new Error("Prayer request content is required.");
    }

    const currentUser = auth.currentUser;

    /*
     * Get the user's profile from Firestore.
     */
    const userRef = doc(
        db,
        "users",
        currentUser.uid
    );

    const userSnapshot = await getDoc(userRef);

    let userName = currentUser.email || "User";

    if (userSnapshot.exists()) {

        const userData = userSnapshot.data();

        const firstName = userData.firstName || "";
        const lastName = userData.lastName || "";

        const fullName =
            `${firstName} ${lastName}`.trim();

        if (fullName) {
            userName = fullName;
        }
    }

    const requestData = {

        userId: currentUser.uid,

        title: title.trim(),

        content: content.trim(),

        date: Timestamp.now(),

        userName: userName,

        status: "Pending"
    };

    const documentReference = await addDoc(
        collection(db, "prayerRequests"),
        requestData
    );

    return {
        requestId: documentReference.id,

        userId: requestData.userId,

        title: requestData.title,

        content: requestData.content,

        date: requestData.date.toDate().toISOString(),

        userName: requestData.userName,

        status: requestData.status
    };
};


/*
 * USER:
 * Get only the currently logged-in user's
 * prayer requests.
 */
window.firebaseAuth.getMyPrayerRequests = async function () {

    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    const currentUser = auth.currentUser;

    const snapshot = await getDocs(
        collection(db, "prayerRequests")
    );

    const requests = [];

    snapshot.forEach((documentSnapshot) => {

        const data = documentSnapshot.data();

        /*
         * Only return this user's requests.
         */
        if (data.userId !== currentUser.uid) {
            return;
        }

        requests.push({

            requestId: documentSnapshot.id,

            userId: data.userId || "",

            title: data.title || "",

            content: data.content || "",

            date: data.date
                ? data.date.toDate().toISOString()
                : new Date().toISOString(),

            userName: data.userName || "",

            status: data.status || "Pending"
        });
    });

    /*
     * Newest first.
     */
    requests.sort(
        (a, b) =>
            new Date(b.date) - new Date(a.date)
    );

    return requests;
};

/*
 * ADMIN:
 * Update the status of a prayer request.
 */
window.firebaseAuth.updatePrayerRequestStatus = async function (
    requestId,
    status
) {

    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    const validStatuses = [
        "Pending",
        "Approved",
        "Answered",
        "Rejected"
    ];

    if (!validStatuses.includes(status)) {
        throw new Error("Invalid prayer request status.");
    }

    if (!requestId) {
        throw new Error("Prayer request ID is required.");
    }

    const requestRef = doc(
        db,
        "prayerRequests",
        requestId
    );

    await updateDoc(
        requestRef,
        {
            status: status,
            updatedAt: Timestamp.now()
        }
    );

    return true;
};

window.firebaseAuth.getDashboardStats = async function () {

    if (!auth.currentUser) {
        throw new Error("No authenticated Firebase user.");
    }

    console.log(
        "Dashboard Firebase UID:",
        auth.currentUser.uid
    );


    async function countCollection(collectionName) {

        console.log(
            `Dashboard: reading ${collectionName}...`
        );

        try {

            const snapshot = await getDocs(
                collection(db, collectionName)
            );

            console.log(
                `Dashboard: ${collectionName} = ${snapshot.size}`
            );

            return snapshot.size;

        }
        catch (error) {

            console.error(
                `Dashboard FAILED: ${collectionName}`,
                error
            );

            throw new Error(
                `Firestore collection '${collectionName}' failed: ${error.message}`
            );
        }
    }


    const users =
        await countCollection("users");


    const donations =
        await countCollection("donations");


    const sermons =
        await countCollection("sermons");


    const messages =
        await countCollection("messages");


    const announcements =
        await countCollection("announcements");


    const gallery =
        await countCollection("gallery");


    const prayerRequests =
        await countCollection("prayerRequests");


    const outreachPrograms =
        await countCollection("outreachPrograms");


    return {
        users: users,
        donations: donations,
        sermons: sermons,
        messages: messages,
        announcements: announcements,
        gallery: gallery,
        prayerRequests: prayerRequests,
        outreachPrograms: outreachPrograms
    };
};
