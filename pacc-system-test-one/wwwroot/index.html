<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>Christian Centre</title>

    <base href="/" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Application CSS -->
    <link href="app.css" rel="stylesheet" />

    <link rel="stylesheet"
          href="pacc-system-test-one.styles.css" />

    <link rel="icon" href="data:,">

</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">
        Loading...
    </div>

    <div id="blazor-error-ui"
         data-nosnippet>

        An unhandled error has occurred.

        <a href="." class="reload">
            Reload
        </a>

        <span class="dismiss">
            🗙
        </span>

    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Firebase -->
    <script type="module">

                import {
                    initializeApp
                } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

                import {
                    getAuth,
                    createUserWithEmailAndPassword,
                    signInWithEmailAndPassword,
                    signOut,
                    onAuthStateChanged,
                    setPersistence,
                    browserLocalPersistence
                } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

                import {
                    getFirestore,
                    doc,
                    setDoc,
                    getDoc
                } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


                /*
                 * Firebase configuration
                 */
                const firebaseConfig = {

                    apiKey: "AIzaSyBpsFphitX3tnTVqWnkusMgU6G2kZNd-vI",

                    authDomain:
                        "interview-prep-6caf8.firebaseapp.com",

                    projectId:
                        "interview-prep-6caf8",

                    storageBucket:
                        "interview-prep-6caf8.firebasestorage.app",

                    messagingSenderId:
                        "7763277998",

                    appId:
                        "1:7763277998:web:49d02d97d55c5a8f48d53f",

                    measurementId:
                        "G-F52N8W4DF7"
                };


                let firebaseApp;
                let auth;
                let db;


                /*
                 * Initialize Firebase
                 */
                try {

                    firebaseApp =
                        initializeApp(firebaseConfig);


                    auth =
                        getAuth(firebaseApp);


                    db =
                        getFirestore(firebaseApp);


                    /*
                     * Keep the user authenticated between
                     * page navigation and application restarts.
                     */
                    await setPersistence(
                        auth,
                        browserLocalPersistence
                    );


                    console.log(
                        "Firebase initialized successfully"
                    );


                    /*
                     * Wait until Firebase has determined
                     * the current authentication state.
                     */
                    function waitForAuthState() {

                        return new Promise((resolve) => {

                            const unsubscribe =
                                onAuthStateChanged(
                                    auth,
                                    (user) => {

                                        unsubscribe();

                                        resolve(user);

                                    }
                                );

                        });

                    }


                    /*
                     * Get the Firestore profile for
                     * the currently authenticated user.
                     */
                    async function getUserProfile(user) {

                        if (!user) {
                            return null;
                        }


                        const userDocument =
                            await getDoc(
                                doc(
                                    db,
                                    "users",
                                    user.uid
                                )
                            );


                        if (!userDocument.exists()) {

                            console.warn(
                                "Firestore profile does not exist for:",
                                user.uid
                            );

                            return {

                                uid: user.uid,

                                firstName: "",

                                lastName: "",

                                emailAddress:
                                    user.email ?? "",

                                userType: "User"

                            };
                        }


                        const data =
                            userDocument.data();


                        return {

                            uid: user.uid,

                            firstName:
                                data.firstName ?? "",

                            lastName:
                                data.lastName ?? "",

                            emailAddress:
                                data.emailAddress ??
                                user.email ??
                                "",

                            userType:
                                data.userType ??
                                "User"
                        };
                    }


                    /*
                     * Firebase bridge used by Blazor.
                     */
                    window.firebaseAuth = {


                        /*
                         * REGISTER
                         */
                        register: async function (
                            email,
                            password,
                            firstName,
                            lastName
                        ) {

                            try {

                                const result =
                                    await createUserWithEmailAndPassword(
                                        auth,
                                        email,
                                        password
                                    );


                                const user =
                                    result.user;


                                /*
                                 * Create the user's Firestore profile.
                                 */
                                await setDoc(

                                    doc(
                                        db,
                                        "users",
                                        user.uid
                                    ),

                                    {

                                        firebaseUid:
                                            user.uid,

                                        firstName:
                                            firstName,

                                        lastName:
                                            lastName,

                                        emailAddress:
                                            email,

                                        userType:
                                            "User"
                                    }
                                );


                                console.log(
                                    "User profile created:",
                                    user.uid
                                );


                                return {

                                    success: true,

                                    uid:
                                        user.uid,

                                    firstName:
                                        firstName,

                                    lastName:
                                        lastName,

                                    emailAddress:
                                        email,

                                    userType:
                                        "User"
                                };

                            }
                            catch (error) {

                                console.error(
                                    "Firebase registration error:",
                                    error
                                );


                                return {

                                    success: false,

                                    message:
                                        error.message
                                };
                            }
                        },


                        /*
                         * LOGIN
                         */
                        login: async function (
                            email,
                            password
                        ) {

                            try {

                                const result =
                                    await signInWithEmailAndPassword(
                                        auth,
                                        email,
                                        password
                                    );


                                const user =
                                    result.user;


                                console.log(
                                    "Firebase login successful:",
                                    user.uid
                                );


                                /*
                                 * Firebase has authenticated the user.
                                 * Now retrieve their Firestore profile.
                                 */
                                const profile =
                                    await getUserProfile(user);


                                if (!profile) {

                                    return {

                                        success: false,

                                        message:
                                            "Unable to load user profile."
                                    };
                                }


                                return {

                                    success: true,

                                    uid:
                                        profile.uid,

                                    firstName:
                                        profile.firstName,

                                    lastName:
                                        profile.lastName,

                                    emailAddress:
                                        profile.emailAddress,

                                    userType:
                                        profile.userType
                                };

                            }
                            catch (error) {

                                console.error(
                                    "Firebase login error:",
                                    error
                                );


                                return {

                                    success: false,

                                    message:
                                        error.message
                                };
                            }
                        },


                        /*
                         * GET CURRENT USER
                         */
                        getCurrentUser: async function () {

                            console.log(
                                "Checking Firebase authentication state..."
                            );


                            /*
                             * IMPORTANT:
                             *
                             * Do not directly use:
                             *
                             * auth.currentUser
                             *
                             * because Firebase may still be
                             * restoring the authentication state.
                             */
                            const user =
                                await waitForAuthState();


                            if (!user) {

                                console.log(
                                    "No authenticated Firebase user."
                                );

                                return null;
                            }


                            console.log(
                                "Authenticated Firebase user:",
                                user.email
                            );


                            return await getUserProfile(user);
                        },


                        /*
                         * LOGOUT
                         */
                        logout: async function () {

                            try {

                                await signOut(auth);


                                console.log(
                                    "Firebase user signed out"
                                );


                                return {

                                    success: true

                                };

                            }
                            catch (error) {

                                console.error(
                                    "Firebase logout error:",
                                    error
                                );


                                return {

                                    success: false,

                                    message:
                                        error.message
                                };
                            }
                        }

                    };


                    /*
                     * Firebase is ready.
                     */
                    window.isFirebaseReady =
                        function () {

                            return true;

                        };


                    console.log(
                        "Firebase authentication bridge ready"
                    );

                }
                catch (error) {

                    console.error(
                        "Firebase initialization failed:",
                        error
                    );


                    window.isFirebaseReady =
                        function () {

                            return false;

                        };

                }

    </script>


    <!-- Blazor WebView - ONLY ONCE -->
    <script src="_framework/blazor.webview.js"
            autostart="false">
    </script>

</body>

</html>
