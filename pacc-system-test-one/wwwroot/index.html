    <script type="module">

                import {
                    initializeApp
                } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

                import {
                    getAuth,
                    createUserWithEmailAndPassword,
                    signInWithEmailAndPassword,
                    signOut,
                    onAuthStateChanged,
                    setPersistence,
                    browserLocalPersistence
                } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

                import {
                    getFirestore,
                    collection,
                    getDocs,
                    getDoc,
                    addDoc,
                    updateDoc,
                    deleteDoc,
                    doc
                } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


                /*
                 * Firebase configuration
                 */
                const firebaseConfig = {

                    apiKey: "AIzaSyBpsFphitX3tnTVqWnkusMgU6G2kZNd-vI",

                    authDomain:
                        "interview-prep-6caf8.firebaseapp.com",

                    projectId:
                        "interview-prep-6caf8",

                    storageBucket:
                        "interview-prep-6caf8.firebasestorage.app",

                    messagingSenderId:
                        "7763277998",

                    appId:
                        "1:7763277998:web:49d02d97d55c5a8f48d53f",

                    measurementId:
                        "G-F52N8W4DF7"
                };


                let firebaseApp;
                let auth;
                let db;


                /*
                 * Initialize Firebase
                 */
                try {

                    firebaseApp =
                        initializeApp(firebaseConfig);


                    auth =
                        getAuth(firebaseApp);


                    db =
                        getFirestore(firebaseApp);


                    /*
                     * Keep the user authenticated between
                     * page navigation and application restarts.
                     */
                    await setPersistence(
                        auth,
                        browserLocalPersistence
                    );


                    console.log(
                        "Firebase initialized successfully"
                    );


                    /*
                     * Wait until Firebase has determined
                     * the current authentication state.
                     */
                    function waitForAuthState() {

                        return new Promise((resolve) => {

                            const unsubscribe =
                                onAuthStateChanged(
                                    auth,
                                    (user) => {

                                        unsubscribe();

                                        resolve(user);

                                    }
                                );

                        });

                    }


                    /*
                     * Get the Firestore profile for
                     * the currently authenticated user.
                     */
                    async function getUserProfile(user) {

                        if (!user) {
                            return null;
                        }


                        const userDocument =
                            await getDoc(
                                doc(
                                    db,
                                    "users",
                                    user.uid
                                )
                            );


                        if (!userDocument.exists()) {

                            console.warn(
                                "Firestore profile does not exist for:",
                                user.uid
                            );

                            return {

                                uid: user.uid,

                                firstName: "",

                                lastName: "",

                                emailAddress:
                                    user.email ?? "",

                                userType: "User"

                            };
                        }


                        const data =
                            userDocument.data();


                        return {

                            uid: user.uid,

                            firstName:
                                data.firstName ?? "",

                            lastName:
                                data.lastName ?? "",

                            emailAddress:
                                data.emailAddress ??
                                user.email ??
                                "",

                            userType:
                                data.userType ??
                                "User"
                        };
                    }


                    /*
                     * Firebase bridge used by Blazor.
                     */
                    window.firebaseAuth = {


                        /*
                         * REGISTER
                         */
                        register: async function (
                            email,
                            password,
                            firstName,
                            lastName
                        ) {

                            try {

                                const result =
                                    await createUserWithEmailAndPassword(
                                        auth,
                                        email,
                                        password
                                    );


                                const user =
                                    result.user;


                                /*
                                 * Create the user's Firestore profile.
                                 */
                                await setDoc(

                                    doc(
                                        db,
                                        "users",
                                        user.uid
                                    ),

                                    {

                                        firebaseUid:
                                            user.uid,

                                        firstName:
                                            firstName,

                                        lastName:
                                            lastName,

                                        emailAddress:
                                            email,

                                        userType:
                                            "User"
                                    }
                                );


                                console.log(
                                    "User profile created:",
                                    user.uid
                                );


                                return {

                                    success: true,

                                    uid:
                                        user.uid,

                                    firstName:
                                        firstName,

                                    lastName:
                                        lastName,

                                    emailAddress:
                                        email,

                                    userType:
                                        "User"
                                };

                            }
                            catch (error) {

                                console.error(
                                    "Firebase registration error:",
                                    error
                                );


                                return {

                                    success: false,

                                    message:
                                        error.message
                                };
                            }
                        },


                        /*
                         * LOGIN
                         */
                        login: async function (
                            email,
                            password
                        ) {

                            try {

                                const result =
                                    await signInWithEmailAndPassword(
                                        auth,
                                        email,
                                        password
                                    );


                                const user =
                                    result.user;


                                console.log(
                                    "Firebase login successful:",
                                    user.uid
                                );


                                /*
                                 * Firebase has authenticated the user.
                                 * Now retrieve their Firestore profile.
                                 */
                                const profile =
                                    await getUserProfile(user);


                                if (!profile) {

                                    return {

                                        success: false,

                                        message:
                                            "Unable to load user profile."
                                    };
                                }


                                return {

                                    success: true,

                                    uid:
                                        profile.uid,

                                    firstName:
                                        profile.firstName,

                                    lastName:
                                        profile.lastName,

                                    emailAddress:
                                        profile.emailAddress,

                                    userType:
                                        profile.userType
                                };

                            }
                            catch (error) {

                                console.error("Firebase login error:",error);

                                return {

                                    success: false,

                                    message: error.message
                                };
                            }
                        },


                        /*
                         * GET CURRENT USER
                         */
                        getCurrentUser: async function () {

                            console.log(
                                "Checking Firebase authentication state..."
                            );


                            /*
                             * IMPORTANT:
                             *
                             * Do not directly use:
                             *
                             * auth.currentUser
                             *
                             * because Firebase may still be
                             * restoring the authentication state.
                             */
                            const user =
                                await waitForAuthState();


                            if (!user) {

                                console.log(
                                    "No authenticated Firebase user."
                                );

                                return null;
                            }


                            console.log(
                                "Authenticated Firebase user:",
                                user.email
                            );


                            return await getUserProfile(user);
                        },


                        /*
                         * LOGOUT
                         */
                        logout: async function () {

                            try {

                                await signOut(auth);


                                console.log(
                                    "Firebase user signed out"
                                );


                                return {

                                    success: true

                                };

                            }
                            catch (error) {

                                console.error(
                                    "Firebase logout error:",
                                    error
                                );


                                return {

                                    success: false,

                                    message:
                                        error.message
                                };
                            }
                        }

                    };


                    /*
                     * Firebase is ready.
                     */
                    window.isFirebaseReady =
                        function () {

                            return true;

                        };


                    console.log(
                        "Firebase authentication bridge ready"
                    );

                }
                catch (error) {

                    console.error(
                        "Firebase initialization failed:",
                        error
                    );


                    window.isFirebaseReady =
                        function () {

                            return false;

                        };

};

window.firebaseAuth.getUsers = async function () {

    const currentUser = auth.currentUser;

    if (!currentUser) {
        throw new Error("You must be logged in.");
    }

    const snapshot = await getDocs(
        collection(db, "users")
    );

    const users = [];

    snapshot.forEach((documentSnapshot) => {

        const data = documentSnapshot.data();

        users.push({
            userId: documentSnapshot.id,
            firebaseUid: data.firebaseUid || documentSnapshot.id,
            firstName: data.firstName || "",
            lastName: data.lastName || "",
            emailAddress: data.emailAddress || "",
            userType: data.userType || "User"
        });

    });

    return users;
};


window.firebaseAuth.updateUserRole = async function (
    userId,
    userType
) {

    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    if (
        userType !== "User" &&
        userType !== "Admin"
    ) {
        throw new Error("Invalid user type.");
    }

    await updateDoc(
        doc(db, "users", userId),
        {
            userType: userType
        }
    );

    return true;
};


window.firebaseAuth.deleteUserProfile = async function (
    userId
) {

    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    await deleteDoc(
        doc(db, "users", userId)
    );

    return true;
};

window.firebaseAuth.getAnnouncements = async function () {

    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    const snapshot = await getDocs(
        collection(db, "announcements")
    );

    const announcements = [];

    snapshot.forEach((documentSnapshot) => {

        const data = documentSnapshot.data();

        announcements.push({
            announcementId: documentSnapshot.id,

            title: data.title || "",

            description: data.description || "",

            announcementDate:
                data.announcementDate || new Date().toISOString(),

            location:
                data.location || "",

            category:
                data.category || "General",

            createdAt:
                data.createdAt || new Date().toISOString(),

            updatedAt:
                data.updatedAt || new Date().toISOString()
        });
    });

    announcements.sort((a, b) =>
        new Date(b.announcementDate) -
        new Date(a.announcementDate)
    );

    return announcements;
};


window.firebaseAuth.createAnnouncement = async function (
    title,
    description,
    announcementDate,
    location,
    category
) {

    console.log("createAnnouncement called");

    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    const now = new Date().toISOString();

    await addDoc(
        collection(db, "announcements"),
        {
            title: title || "",
            description: description || "",
            announcementDate:
                new Date(announcementDate).toISOString(),
            location: location || "",
            category: category || "General",
            createdAt: now,
            updatedAt: now
        }
    );

    return true;
};


window.firebaseAuth.updateAnnouncement = async function (
    announcementId,
    title,
    description,
    announcementDate,
    location,
    category
) {

    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    if (!announcementId) {
        throw new Error("Announcement ID is required.");
    }

    await updateDoc(
        doc(
            db,
            "announcements",
            announcementId
        ),
        {
            title: title || "",
            description: description || "",
            announcementDate:
                new Date(announcementDate).toISOString(),
            location: location || "",
            category: category || "General",
            updatedAt:
                new Date().toISOString()
        }
    );

    return true;
};


window.firebaseAuth.deleteAnnouncement = async function (
    announcementId
) {

    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    if (!announcementId) {
        throw new Error("Announcement ID is required.");
    }

    await deleteDoc(
        doc(
            db,
            "announcements",
            announcementId
        )
    );

    return true;
};

// Get all donations
window.firebaseAuth.getDonations = async function () {
    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    const snapshot = await getDocs(
        collection(db, "donations")
    );

    const donations = [];

    snapshot.forEach((documentSnapshot) => {
        const data = documentSnapshot.data();

        donations.push({
            donationId: documentSnapshot.id,
            userId: data.userId || "",
            amount: Number(data.amount || 0),
            date: data.date || new Date().toISOString(),
            donorName: data.donorName || "",
            givingType: data.givingType || "General",
            paymentMethod: data.paymentMethod || "Cash"
        });
    });

    donations.sort(
        (a, b) => new Date(b.date) - new Date(a.date)
    );

    return donations;
};


// Create a donation record
window.firebaseAuth.createDonation = async function (
    userId,
    amount,
    date,
    donorName,
    givingType,
    paymentMethod
) {
    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    if (!Number.isFinite(Number(amount)) || Number(amount) <= 0) {
        throw new Error("Donation amount must be greater than zero.");
    }

    await addDoc(collection(db, "donations"), {
        userId: userId || "",
        amount: Number(amount),
        date: new Date(date).toISOString(),
        donorName: donorName || "",
        givingType: givingType || "General",
        paymentMethod: paymentMethod || "Cash"
    });

    return true;
};


// Update a donation record
window.firebaseAuth.updateDonation = async function (
    donationId,
    userId,
    amount,
    date,
    donorName,
    givingType,
    paymentMethod
) {
    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    if (!donationId) {
        throw new Error("Donation ID is required.");
    }

    if (!Number.isFinite(Number(amount)) || Number(amount) <= 0) {
        throw new Error("Donation amount must be greater than zero.");
    }

    await updateDoc(
        doc(db, "donations", donationId),
        {
            userId: userId || "",
            amount: Number(amount),
            date: new Date(date).toISOString(),
            donorName: donorName || "",
            givingType: givingType || "General",
            paymentMethod: paymentMethod || "Cash"
        }
    );

    return true;
};


// Delete a donation record
window.firebaseAuth.deleteDonation = async function (donationId) {
    if (!auth.currentUser) {
        throw new Error("You must be logged in.");
    }

    if (!donationId) {
        throw new Error("Donation ID is required.");
    }

    await deleteDoc(
        doc(db, "donations", donationId)
    );

    return true;
};
