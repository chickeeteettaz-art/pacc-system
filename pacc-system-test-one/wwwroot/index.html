<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>Christian Centre</title>

    <base href="/" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Your custom styles (must come AFTER Bootstrap) -->
    <link href="app.css" rel="stylesheet" />
    <link rel="stylesheet" href="pacc-system-test-one.styles.css" />

    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">
        Loading...
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.

        <a href="." class="reload">
            Reload
        </a>

        <span class="dismiss">
            🗙
        </span>
    </div>

    <!-- Bootstrap 5 JS (needed for the hamburger menu) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <!-- Firebase -->
    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            setDoc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        const firebaseConfig = {
            apiKey: "AIzaSyBpsFphitX3tnTVqWnkusMgU6G2kZNd-vI",
            authDomain: "interview-prep-6caf8.firebaseapp.com",
            projectId: "interview-prep-6caf8",
            storageBucket: "interview-prep-6caf8.firebasestorage.app",
            messagingSenderId: "7763277998",
            appId: "1:7763277998:web:49d02d97d55c5a8f48d53f",
            measurementId: "G-F52N8W4DF7"
        };


        let firebaseApp;
        let auth;
        let db;


        try {

            firebaseApp = initializeApp(firebaseConfig);

            auth = getAuth(firebaseApp);

            db = getFirestore(firebaseApp);

            console.log("Firebase initialized successfully");


            window.firebaseAuth = {

                register: async function (
                    email,
                    password,
                    firstName,
                    lastName
                ) {

                    try {

                        const result =
                            await createUserWithEmailAndPassword(
                                auth,
                                email,
                                password
                            );

                        const user = result.user;


                        await setDoc(
                            doc(db, "users", user.uid),
                            {
                                firebaseUid: user.uid,
                                firstName: firstName,
                                lastName: lastName,
                                emailAddress: email,
                                userType: "User"
                            }
                        );


                        return {
                            success: true,
                            uid: user.uid,
                            firstName: firstName,
                            lastName: lastName,
                            emailAddress: email,
                            userType: "User"
                        };

                    }
                    catch (error) {

                        console.error(
                            "Firebase registration error:",
                            error
                        );

                        return {
                            success: false,
                            message: error.message
                        };
                    }
                },


                login: async function (
                    email,
                    password
                ) {

                    try {

                        const result =
                            await signInWithEmailAndPassword(
                                auth,
                                email,
                                password
                            );

                        const user = result.user;


                        const userDocument =
                            await getDoc(
                                doc(
                                    db,
                                    "users",
                                    user.uid
                                )
                            );


                        if (!userDocument.exists()) {

                            return {
                                success: false,
                                message:
                                    "User profile does not exist."
                            };
                        }


                        const data =
                            userDocument.data();


                        return {

                            success: true,

                            uid: user.uid,

                            firstName:
                                data.firstName ?? "",

                            lastName:
                                data.lastName ?? "",

                            emailAddress:
                                data.emailAddress ??
                                user.email ??
                                "",

                            userType:
                                data.userType ??
                                "User"
                        };

                    }
                    catch (error) {

                        console.error(
                            "Firebase login error:",
                            error
                        );

                        return {
                            success: false,
                            message: error.message
                        };
                    }
                },


                logout: async function () {

                    await signOut(auth);

                    return {
                        success: true
                    };
                },


                getCurrentUser: async function () {

                    const user = auth.currentUser;

                    if (!user) {
                        return null;
                    }


                    const userDocument =
                        await getDoc(
                            doc(
                                db,
                                "users",
                                user.uid
                            )
                        );


                    if (!userDocument.exists()) {
                        return null;
                    }


                    const data =
                        userDocument.data();


                    return {

                        uid: user.uid,

                        firstName:
                            data.firstName ?? "",

                        lastName:
                            data.lastName ?? "",

                        emailAddress:
                            data.emailAddress ??
                            user.email ??
                            "",

                        userType:
                            data.userType ??
                            "User"
                    };
                }

            };


            // Explicit readiness function
            window.isFirebaseReady = function () {
                return true;
            };


            console.log(
                "Firebase authentication bridge ready"
            );

        }
        catch (error) {

            console.error(
                "Firebase initialization failed:",
                error
            );


            window.isFirebaseReady = function () {
                return false;
            };

        }

    </script>


    <script src="_framework/blazor.webview.js"
            autostart="false">
    </script>

</body>

</html>
